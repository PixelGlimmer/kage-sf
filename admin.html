<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kage Admin | Управление</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

  <div id="toast-container" class="toast-container"></div>

  <div id="loading-screen" class="login-wrapper">
    <div class="login-card glass-panel">
      <h1>Проверка доступа...</h1>
      <p id="access-error" class="form-status is-error"></p>
    </div>
  </div>

  <div id="admin-panel" class="app-layout" style="display: none;">
    <aside class="sidebar glass-panel">
      <div class="user-profile">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
          <strong id="admin-name">...</strong>
          <span id="admin-role" class="role-badge">...</span>
        </div>
      </div>
      <nav class="admin-nav">
        <button class="nav-btn" onclick="window.location.href='index.html'">🎯 К аудиту</button>
        <button class="nav-btn active" onclick="switchTab('team', this)">👥 Состав</button>
        <button class="nav-btn" onclick="switchTab('history', this)">📜 История</button>
      </nav>
      <button onclick="logout()" class="button button-secondary" style="margin-top: auto; width: 100%;">Выйти</button>
    </aside>

    <main class="main-content">
      <section id="tab-team" class="tab-content">
        <header class="top-bar">
          <h1>Управление составом</h1>
          <p>Изменение ролей и выдача доступов</p>
        </header>
        <div class="glass-panel table-panel">
          <table class="admin-table">
            <thead>
              <tr><th>Имя</th><th>Discord ID</th><th>Роль</th><th>Действие</th></tr>
            </thead>
            <tbody id="team-list"></tbody>
          </table>
        </div>
      </section>

      <section id="tab-history" class="tab-content" style="display: none;">
        <header class="top-bar">
          <h1>История аудитов</h1>
          <p>Последние 50 записей</p>
        </header>
        <div class="glass-panel table-panel">
          <table class="admin-table">
            <thead>
              <tr><th>Дата</th><th>Команда</th><th>Проводил</th><th>Участник</th><th>Причина</th></tr>
            </thead>
            <tbody id="history-list"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
