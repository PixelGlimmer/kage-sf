<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kage Audit | V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

  <div id="toast-container" class="toast-container"></div>

  <div id="login-screen" class="login-wrapper">
    <div class="login-glow"></div>
    <section class="login-card glass-panel">
      <h1>Kage Audit</h1>
      <p class="lead-text">Авторизация в системе</p>
      
      <button onclick="loginWithDiscord()" class="button button-discord">Войти через Discord</button>
      <div class="divider">или по логину</div>

      <form id="login-form" class="login-form">
        <label><span>Логин</span><input type="text" id="login" required></label>
        <label><span>Пароль</span><input type="password" id="password" required></label>
        <button class="button button-primary" type="submit">Войти</button>
        <p id="login-error" class="form-status is-error"></p>
      </form>
    </section>
  </div>

  <div id="audit-screen" class="app-layout" style="display: none;">
    <aside class="sidebar glass-panel">
      <div class="user-profile">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
          <strong id="executor-name">...</strong>
          <span id="preview-role" class="role-badge">...</span>
        </div>
      </div>
      <nav class="admin-nav">
        <button class="nav-btn active">🎯 Аудит</button>
        <button class="nav-btn" onclick="window.location.href='admin.html'">⚙️ Админ-панель</button>
      </nav>
      <button onclick="logout()" class="button button-secondary" style="margin-top: auto; width: 100%;">Выйти</button>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <h1>Кадровый аудит</h1>
        <p>Выбери команду и заполни форму</p>
      </header>

      <div class="content-grid">
        <section class="commands-section glass-panel">
          <h2>Сценарии</h2>
          <div class="command-grid" id="command-grid"></div>
        </section>

        <section class="form-section glass-panel">
          <form id="audit-form" class="status-form">
            <div class="input-row">
              <label><span>Участник</span><input type="text" name="player" required></label>
              <label><span>Имя Фамилия</span><input type="text" name="full_name" required></label>
            </div>
            <div class="input-row">
              <label><span>Discord ID</span><input type="text" name="discord_id" required></label>
              <label><span>Статик ID</span><input type="text" name="static_id"></label>
            </div>
            <label><span id="reason-label">Причина</span><textarea name="reason" rows="4" required></textarea></label>
            
            <button type="submit" class="button button-primary submit-btn">Отправить аудит</button>
          </form>

          <div class="mini-preview">
            <h3>Предпросмотр в Discord</h3>
            <div class="discord-embed">
              <div class="embed-accent"></div>
              <div class="embed-content">
                <h4 id="preview-title">Название команды</h4>
                <p><strong>Участник:</strong> <span id="preview-player">...</span></p>
                <p><strong>Проводит:</strong> <span id="preview-executor">...</span></p>
                <p><strong>Причина:</strong> <span id="preview-reason">...</span></p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
